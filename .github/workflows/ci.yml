name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest -q
      - run: python -m build
      - name: Verify installed wheel and bundled sample outside the repository
        shell: bash
        run: |
          python -m venv wheel-env
          if [ -f wheel-env/Scripts/python.exe ]; then
            wheel_python="$PWD/wheel-env/Scripts/python.exe"
          else
            wheel_python="$PWD/wheel-env/bin/python"
          fi
          "$wheel_python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$wheel_python" -m trending_keywords demo --top 3
